[project]
name = "floorplan2dxf"
version = "0.1.0"
description = "Hybrid floor-plan raster to semantic DXF (CubiCasa + OCR + ezdxf)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "scipy>=1.11",
  "shapely>=2.0",
  "scikit-image>=0.22",
  "pymupdf>=1.24",
  "ezdxf>=1.3",
  "pillow>=10.0",
]

[project.optional-dependencies]
ocr = ["easyocr>=1.7"]
recognizer = ["torch>=2.1", "gdown>=5.0"]
dev = ["pytest>=8.0"]
service = ["fastapi>=0.115", "python-multipart>=0.0.20", "uvicorn>=0.34"]

[project.scripts]
floorplan2dxf = "floorplan2dxf.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
