name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # FIRESHIELD_WORKER_URL is an optional repo variable
      # (Settings → Secrets and variables → Actions → Variables). Set it after
      # the Cloudflare Worker is deployed; until then the AI phases show an
      # explicit "not configured" state instead of faking results.
      - name: Build web (FireShield target)
        run: >
          flutter build web
          -t lib/fireshield_main.dart
          --release
          --base-href /fireshield/
          --dart-define=FIRESHIELD_WORKER_URL=${{ vars.FIRESHIELD_WORKER_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
