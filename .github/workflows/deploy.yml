name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Repository variables can override the checked-in public endpoints.
      # Groq/service-role secrets never enter this build.
      - name: Build web (FireShield target)
        run: >
          flutter build web
          -t lib/fireshield_main.dart
          --release
          --base-href /fireshield/
          --dart-define=FIRESHIELD_WORKER_URL=${{ vars.FIRESHIELD_WORKER_URL || 'https://fireshield-groq-gateway.thevikram123.workers.dev' }}
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL || 'https://dhchsufskqecoelrdhwa.supabase.co' }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_G9MwIp8usNm-7povOkNLWg_fFqubU9L' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
